<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaTok Bulk • Central de Atualizações</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0b0e;
      background-image: 
        radial-gradient(at 15% 20%, rgba(225, 48, 108, 0.15) 0px, transparent 50%),
        radial-gradient(at 85% 80%, rgba(254, 44, 85, 0.15) 0px, transparent 50%);
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    .header-card {
      background: rgba(16, 16, 20, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      box-shadow: 0 0 15px #e1306c;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff, #dcdce0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 11px;
      background: rgba(48, 209, 88, 0.12);
      color: #30d158;
      border: 1px solid rgba(48, 209, 88, 0.3);
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .update-card {
      background: rgba(16, 16, 20, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .update-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .update-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .version-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .version-tag span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e1306c;
    }

    .update-date {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
    }

    .update-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .update-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .update-items li {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .update-items li::before {
      content: "•";
      color: #e1306c;
      font-weight: bold;
      font-size: 16px;
      line-height: 14px;
    }

    .tag {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      text-transform: uppercase;
      margin-right: 6px;
    }
    .tag-feature { background: rgba(48, 209, 88, 0.18); color: #30d158; }
    .tag-fix { background: rgba(255, 69, 58, 0.18); color: #ff453a; }
    .tag-improve { background: rgba(252, 176, 69, 0.18); color: #fcb045; }

    .footer {
      text-align: center;
      margin-top: 36px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <div class="brand-group">
        <div class="brand-dot"></div>
        <div class="brand-name">InstaTok Bulk</div>
      </div>
      <div class="status-badge">Sistema Online</div>
    </div>

    <div class="timeline" id="updates-feed">
      <div style="text-align:center; padding: 20px; color: rgba(255,255,255,0.4); font-size: 13px;">
        Carregando novidades do sistema...
      </div>
    </div>

    <div class="footer">
      InstaTok Bulk • Central Oficial de Versões & Melhorias
    </div>
  </div>

  <script>
    fetch('updates.json')
      .then(response => response.json())
      .then(data => {
        const feed = document.getElementById('updates-feed');
        feed.innerHTML = '';

        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'update-card';

          const itemsHtml = item.changes.map(c => `
            <li>
              <span>
                <span class="tag tag-${c.type}">${c.label}</span>${c.text}
              </span>
            </li>
          `).join('');

          card.innerHTML = `
            <div class="update-header">
              <div class="version-tag"><span></span>v${item.version}</div>
              <div class="update-date">${item.date}</div>
            </div>
            <div class="update-title">${item.title}</div>
            <ul class="update-items">
              ${itemsHtml}
            </ul>
          `;

          feed.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('updates-feed').innerHTML = `
          <div style="text-align:center; padding: 20px; color: #ff453a; font-size: 13px;">
            Não foi possível carregar as novidades no momento.
          </div>
        `;
      });
  </script>
</body>
</html>
