<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaTok Bulk • Central de Atualizações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #0b0b0e;
      background-image: 
        radial-gradient(at 15% 15%, rgba(225, 48, 108, 0.18) 0px, transparent 55%),
        radial-gradient(at 85% 85%, rgba(254, 44, 85, 0.16) 0px, transparent 55%);
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    /* Cabeçalho Superior */
    .header-card {
      background: rgba(16, 16, 20, 0.88);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 28px 32px;
      margin-bottom: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      box-shadow: 0 0 18px #e1306c;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.6px;
      background: linear-gradient(180deg, #ffffff, #dcdce0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 12.5px;
      background: rgba(48, 209, 88, 0.12);
      color: #30d158;
      border: 1px solid rgba(48, 209, 88, 0.32);
      border-radius: 10px;
      padding: 6px 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    /* Linha do Tempo dos Cards */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .update-card {
      background: rgba(16, 16, 20, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 22px;
      padding: 26px 28px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .update-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6);
    }

    .update-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .version-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .version-tag span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e1306c;
      box-shadow: 0 0 8px #e1306c;
    }

    .update-date {
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.48);
      font-weight: 500;
    }

    .update-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 16px;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .update-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .update-items li {
      font-size: 14.5px;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.55;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .update-items li::before {
      content: "•";
      color: #e1306c;
      font-weight: 800;
      font-size: 18px;
      line-height: 18px;
      margin-top: 1px;
    }

    .tag {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-right: 8px;
      display: inline-block;
    }
    .tag-feature { background: rgba(48, 209, 88, 0.18); color: #30d158; border: 1px solid rgba(48, 209, 88, 0.25); }
    .tag-fix { background: rgba(255, 69, 58, 0.18); color: #ff453a; border: 1px solid rgba(255, 69, 58, 0.25); }
    .tag-improve { background: rgba(252, 176, 69, 0.18); color: #fcb045; border: 1px solid rgba(252, 176, 69, 0.25); }
    .tag-design { background: rgba(191, 90, 242, 0.18); color: #bf5af2; border: 1px solid rgba(191, 90, 242, 0.25); }

    .footer {
      text-align: center;
      margin-top: 45px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <div class="brand-group">
        <div class="brand-dot"></div>
        <div class="brand-name">InstaTok Bulk</div>
      </div>
      <div class="status-badge">Sistema Online</div>
    </div>

    <div class="timeline" id="updates-feed">
      <div style="text-align:center; padding: 30px; color: rgba(255,255,255,0.45); font-size: 14px;">
        Carregando novidades do sistema...
      </div>
    </div>

    <div class="footer">
      InstaTok Bulk • Central Oficial de Versões & Melhorias
    </div>
  </div>

  <script>
    fetch('updates.json?t=' + Date.now())
      .then(response => response.json())
      .then(data => {
        const feed = document.getElementById('updates-feed');
        feed.innerHTML = '';

        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'update-card';

          const itemsHtml = item.changes.map(c => `
            <li>
              <span>
                <span class="tag tag-${c.type}">${c.label}</span>${c.text}
              </span>
            </li>
          `).join('');

          card.innerHTML = `
            <div class="update-header">
              <div class="version-tag"><span></span>v${item.version}</div>
              <div class="update-date">${item.date}</div>
            </div>
            <div class="update-title">${item.title}</div>
            <ul class="update-items">
              ${itemsHtml}
            </ul>
          `;

          feed.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('updates-feed').innerHTML = `
          <div style="text-align:center; padding: 30px; color: #ff453a; font-size: 14px;">
            Não foi possível carregar as novidades no momento.
          </div>
        `;
      });
  </script>
</body>
</html>
