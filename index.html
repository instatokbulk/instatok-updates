<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaTok Bulk • Central de Atualizações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(18, 18, 23, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(225, 48, 108, 0.45);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --brand-gradient: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      --brand-shadow: rgba(225, 48, 108, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 15% 15%, rgba(131, 58, 180, 0.18) 0, transparent 45%),
        radial-gradient(at 85% 85%, rgba(254, 44, 85, 0.15) 0, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 60px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 980px;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 46px;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      color: #e4e4e7;
      margin-bottom: 16px;
      letter-spacing: 0.3px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #30d158;
      box-shadow: 0 0 10px #30d158;
    }

    h1 {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(180deg, #ffffff 40%, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* GRID DE MINI-CARDS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .update-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .update-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: transparent;
      transition: background 0.3s ease;
    }

    .update-card:hover {
      transform: translateY(-4px);
      border-color: var(--card-hover-border);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 20px var(--brand-shadow);
    }

    .update-card:hover::before {
      background: var(--brand-gradient);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .version-tag {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 4px 10px;
      border-radius: 9px;
      letter-spacing: -0.2px;
    }

    .card-latest-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(48, 209, 88, 0.15);
      border: 1px solid rgba(48, 209, 88, 0.35);
      color: #30d158;
      letter-spacing: 0.5px;
    }

    .card-date {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 14px;
      margin-top: auto;
    }

    .card-items-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-open-btn {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      opacity: 0.85;
      transition: all 0.2s;
    }

    .update-card:hover .card-open-btn {
      opacity: 1;
      color: #fcb045;
      transform: translateX(2px);
    }

    /* MODAL FLUTUANTE */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: rgba(18, 18, 24, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 26px;
      width: 100%;
      max-width: 620px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), 0 0 30px var(--brand-shadow);
      padding: 32px;
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      transform: rotate(90deg);
    }

    .modal-header {
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }

    .modal-changes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-change-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px 16px;
      border-radius: 14px;
      transition: background 0.2s;
    }

    .modal-change-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .tag-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.4px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .tag-feature { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.15); }
    .tag-improve { background: rgba(10, 132, 255, 0.18); color: #0a84ff; border: 1px solid rgba(10, 132, 255, 0.35); }
    .tag-fix { background: rgba(255, 69, 58, 0.18); color: #ff453a; border: 1px solid rgba(255, 69, 58, 0.35); }

    .modal-change-text {
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.88);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge-top">
        <span class="badge-dot"></span> Feed de Lançamentos
      </div>
      <h1>Central de Atualizações</h1>
      <p class="subtitle">Acompanhe todas as novidades, melhorias de desempenho e correções do InstaTok Bulk em tempo real.</p>
    </header>

    <main id="cards-container" class="grid">
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
        A carregar histórico de versões...
      </div>
    </main>
  </div>

  <!-- MODAL FLUTUANTE -->
  <div id="modal" class="modal-overlay">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-header">
        <div class="modal-meta">
          <span id="modal-version" class="version-tag"></span>
          <span id="modal-date" class="card-date"></span>
        </div>
        <h2 id="modal-title" class="modal-title"></h2>
      </div>
      <div id="modal-changes" class="modal-changes-list"></div>
    </div>
  </div>

  <script>
    let updatesData = [];

    async function loadUpdates() {
      const container = document.getElementById("cards-container");
      try {
        const res = await fetch(`updates.json?t=${Date.now()}`);
        updatesData = await res.json();
        
        container.innerHTML = "";
        
        updatesData.forEach((item, index) => {
          const card = document.createElement("div");
          card.className = "update-card";
          card.onclick = () => openModal(index);

          const isLatest = index === 0;
          const highlightText = item.highlight || (item.changes[0] ? item.changes[0].text : "");

          card.innerHTML = `
            <div>
              <div class="card-top">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="version-tag">v${item.version}</span>${isLatest ? '<span class="card-latest-badge">MAIS RECENTE</span>' : ''}
                </div>
                <span class="card-date">${item.date}</span>
              </div>
              <h3 class="card-title">${item.title}</h3>
              <p class="card-desc">${highlightText}</p>
            </div>
            <div class="card-footer">
              <span class="card-items-count">${item.changes.length} melhoria(s)</span>
              <span class="card-open-btn">Ver detalhes →</span>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ff453a; padding: 40px;">Erro ao carregar notas de atualização.</div>`;
      }
    }

    function openModal(index) {
      const item = updatesData[index];
      if (!item) return;

      document.getElementById("modal-version").textContent = `Versão ${item.version}`;
      document.getElementById("modal-date").textContent = item.date;
      document.getElementById("modal-title").textContent = item.title;

      const changesContainer = document.getElementById("modal-changes");
      changesContainer.innerHTML = "";

      item.changes.forEach(ch => {
        let tagClass = "tag-feature";
        if (ch.type === "improve") tagClass = "tag-improve";
        if (ch.type === "fix") tagClass = "tag-fix";

        const div = document.createElement("div");
        div.className = "modal-change-item";
        div.innerHTML = `
          <span class="tag-badge ${tagClass}">${ch.label || "INFO"}</span>
          <span class="modal-change-text">${ch.text}</span>
        `;
        changesContainer.appendChild(div);
      });

      const modal = document.getElementById("modal");
      modal.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const modal = document.getElementById("modal");
      modal.classList.remove("active");
      document.body.style.overflow = "";
    }

    document.getElementById("modal").onclick = closeModal;

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    loadUpdates();
  </script>
</body>
</html>
