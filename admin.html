<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaTok Bulk • Gestão Administrativa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    body {
      background: #0b0b0e radial-gradient(at 15% 15%, rgba(225, 48, 108, 0.15) 0, transparent 50%), radial-gradient(at 85% 85%, rgba(254, 44, 85, 0.12) 0, transparent 50%);
      color: #f5f5f7; min-height: 100vh; display: flex; justify-content: center; padding: 40px 16px;
    }
    .container { width: 100%; max-width: 800px; }
    .card {
      background: rgba(16, 16, 20, 0.9); backdrop-filter: blur(28px); border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.65); margin-bottom: 20px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 16px; margin-bottom: 20px; }
    .brand { font-size: 20px; font-weight: 800; background: linear-gradient(180deg, #fff, #dcdce0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn {
      background: linear-gradient(135deg, #833ab4, #e1306c); color: #fff; border: none; padding: 10px 18px;
      border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .input {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff;
      padding: 10px 14px; border-radius: 12px; font-size: 13px; outline: none; width: 100%; max-width: 280px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th { text-align: left; padding: 12px 10px; color: rgba(255, 255, 255, 0.5); font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.08); }
    td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.85); }
    .tag { font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
    .tag-active { background: rgba(48, 209, 88, 0.18); color: #30d158; border: 1px solid rgba(48, 209, 88, 0.3); }
    .tag-banned { background: rgba(255, 69, 58, 0.18); color: #ff453a; border: 1px solid rgba(255, 69, 58, 0.3); }
    .btn-action { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #fff; padding: 5px 10px; border-radius: 8px; font-size: 11.5px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-view" class="card" style="max-width: 400px; margin: 80px auto; text-align: center;">
      <h2 style="margin-bottom: 16px;">Painel Admin</h2>
      <input id="admin-pass" type="password" class="input" placeholder="Palavra-passe de administrador" style="margin-bottom: 14px; width: 100%;">
      <button id="login-btn" class="btn" style="width: 100%;">Aceder ao Painel</button>
    </div>

    <div id="dashboard-view" style="display: none;">
      <div class="card">
        <div class="header">
          <div class="brand">InstaTok Bulk • Gestão de Licenças</div>
          <button id="create-key-btn" class="btn">+ Gerar Nova Licença</button>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: 16px;">
          <input id="search-input" type="text" class="input" placeholder="Filtrar por chave ou dispositivo...">
          <button id="refresh-btn" class="btn-action">🔄 Atualizar Lista</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Chave de Acesso</th>
              <th>Estado</th>
              <th>Dispositivo Vinculado</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="keys-tbody">
            <tr><td colspan="4" style="text-align:center; padding: 30px; color:rgba(255,255,255,0.4);">A carregar dados...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5q1e9kN3MebodGkMk1HYf9Vcb5gkSArp3W5LMVXxQqW_f3MvbYO5NpO985Paq-1w/exec";
    let adminToken = "";

    document.getElementById("login-btn").onclick = async () => {
      const pass = document.getElementById("admin-pass").value;
      if (!pass) return alert("Insira a palavra-passe.");
      adminToken = pass;
      loadDashboard();
    };

    async function loadDashboard() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=admin_list&password=${encodeURIComponent(adminToken)}`);
        const data = await res.json();
        if (data.status === "UNAUTHORIZED") {
          alert("Palavra-passe incorreta.");
          return;
        }
        document.getElementById("login-view").style.display = "none";
        document.getElementById("dashboard-view").style.display = "block";
        renderKeys(data.items || []);
      } catch (e) {
        alert("Falha de ligação ao Google Apps Script.");
      }
    }

    function renderKeys(list) {
      const tbody = document.getElementById("keys-tbody");
      tbody.innerHTML = "";
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:20px; color:rgba(255,255,255,0.4);">Nenhuma licença registada.</td></tr>`;
        return;
      }
      list.forEach(item => {
        const tr = document.createElement("tr");
        const isActive = item.status === "ACTIVE";
        tr.innerHTML = `
          <td style="font-weight:700; color:#fff;">${item.key}</td>
          <td><span class="tag ${isActive ? 'tag-active' : 'tag-banned'}">${isActive ? 'ATIVA' : 'REVOGADA'}</span></td>
          <td style="font-family:monospace; color:rgba(255,255,255,0.6);">${item.device}</td>
          <td>
            <button class="btn-action" onclick="toggleKey('${item.key}')">${isActive ? '🚫 Revogar' : '✔️ Ativar'}</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.toggleKey = async (key) => {
      const res = await fetch(`${SCRIPT_URL}?action=admin_toggle_key&password=${encodeURIComponent(adminToken)}&key=${encodeURIComponent(key)}`);
      const data = await res.json();
      if (data.status === "SUCCESS") loadDashboard();
    };

    document.getElementById("create-key-btn").onclick = async () => {
      const res = await fetch(`${SCRIPT_URL}?action=admin_create_key&password=${encodeURIComponent(adminToken)}`);
      const data = await res.json();
      if (data.status === "SUCCESS") {
        alert("Nova chave gerada: " + data.key);
        loadDashboard();
      }
    };

    document.getElementById("refresh-btn").onclick = loadDashboard;
  </script>
</body>
</html>
